[application]
name=qmlProductManager
organizationName=ECJTU
organizationDomain=ecjtu.local
controlsStyle=Basic
# 场景图渲染后端：OpenGL 需可用 GPU；无 GPU/远程环境请用 Software（软件光栅化，最稳）
graphicsApi=Software
icon=:/images/favicon.ico
qmlEntry=qrc:/qml/Login&Register/Enter.qml

[userDatabase]
# 地址、端口、账号、密码和数据库名由 config/database_server_config.enc 加密保存。
driver=QMYSQL

[businessDatabase]
# 请通过界面的“生成加密配置”或“导入加密配置”管理本数据库服务器信息。
driver=QMYSQL

[ai]
apiKey=请填写DeepSeek密钥
baseUrl=https://api.deepseek.com/chat/completions
model=deepseek-chat
stream=false
systemPrompt=你是产品进销存管理系统的小助手，只回答库存、入库、出库、收支记录和数据分析相关问题。非相关问题请礼貌说明能力范围。
